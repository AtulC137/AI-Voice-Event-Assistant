<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AI Voice Assistant</title>
</head>

<body>

<h1>AI Voice Assistant</h1>

<button id="startBtn">
Start Conversation
</button>

<script>

let websocket=null;
let mediaRecorder=null;
let audioChunks=[];
let currentAudio=null;
let voiceDetectionInterval=null;
let isRecording=false;
let sharedStream=null;
let conversationEnded=false;


/**
* Initialize microphone once
*/
async function initializeMicrophone()
{
    if(sharedStream)
    {
        return;
    }

    sharedStream=
    await navigator.mediaDevices.getUserMedia({
        audio:true
    });

    console.log(
        "Microphone initialized"
    );
}


/**
* Start recording
*/
async function startRecording()
{
    if(
        isRecording ||
        conversationEnded
    )
    {
        return;
    }

    isRecording=true;

    mediaRecorder=
    new MediaRecorder(
        sharedStream
    );

    audioChunks=[];

    mediaRecorder.ondataavailable=
    (event)=>{

    if(
        websocket &&
        websocket.readyState===1
    )
    {
        websocket.send(
            event.data
        );
    }

    console.log(
        "Audio chunk sent:",
        event.data.size
    );

    };

    mediaRecorder.start(500);

    console.log(
        "Recording Started"
    );


    const audioContext=
    new AudioContext();

    const source=
    audioContext
    .createMediaStreamSource(
        sharedStream
    );

    const analyser=
    audioContext
    .createAnalyser();

    source.connect(
        analyser
    );

    analyser.fftSize=512;

    const dataArray=
    new Uint8Array(
        analyser.frequencyBinCount
    );

    let silenceStart=
    Date.now();

    const silenceCheck=
    setInterval(()=>{

        analyser.getByteFrequencyData(
            dataArray
        );

        const volume=
        dataArray.reduce(
            (a,b)=>a+b
        )/
        dataArray.length;


        if(volume>15)
        {
            silenceStart=
            Date.now();
        }


        if(
            Date.now()
            -
            silenceStart
            >
            1500
        )
        {
            clearInterval(
                silenceCheck
            );

            mediaRecorder.stop();
        }

    },100);


    mediaRecorder.onstop=
    ()=>{

        isRecording=false;

        console.log(
            "Recording Stopped"
        );

        if(
            conversationEnded
        )
        {
            return;
        }

        websocket.send(
            "__END_AUDIO__"
        );

        console.log(
            "Audio stream completed"
        );

    };

}



/**
* Detect interruption
*/
async function startVoiceDetection()
{
    clearInterval(
        voiceDetectionInterval
    );

    const audioContext=
    new AudioContext();

    const source=
    audioContext
    .createMediaStreamSource(
        sharedStream
    );

    const analyser=
    audioContext
    .createAnalyser();

    source.connect(
        analyser
    );

    analyser.fftSize=512;

    const dataArray=
    new Uint8Array(
        analyser.frequencyBinCount
    );

    voiceDetectionInterval=
    setInterval(()=>{

        analyser.getByteFrequencyData(
            dataArray
        );

        const volume=
        dataArray.reduce(
            (a,b)=>a+b
        )/
        dataArray.length;


        if(
            volume>25 &&
            currentAudio &&
            !conversationEnded
        )
        {
            console.log(
                "Voice interruption detected"
            );

            currentAudio.pause();

            currentAudio.currentTime=0;

            currentAudio=null;

            clearInterval(
                voiceDetectionInterval
            );

            setTimeout(
            ()=>{
                startRecording();
            },
            300
            );
        }

    },100);

}



/**
* Auto websocket
*/
window.onload=
async()=>{

    websocket=
    new WebSocket(
        "ws://localhost:8000/ws/conversation"
    );

    websocket.binaryType=
    "arraybuffer";


    websocket.onopen=
    async()=>{

        console.log(
            "WebSocket Connected"
        );

        await initializeMicrophone();

    };


    websocket.onmessage=
    async(event)=>{

        if(
            typeof event.data==="string"
        )
        {
            if(
                event.data===
                "__END_AFTER_AUDIO__"
            )
            {
                conversationEnded=true;

                currentAudio.onended=
                ()=>{

                    websocket.close();

                };

                return;
            }
        }


        console.log(
            "Received AI Audio"
        );

        const audioBlob=
        new Blob(
            [event.data],
            {
                type:"audio/wav"
            }
        );

        const audioUrl=
        URL.createObjectURL(
            audioBlob
        );

        currentAudio=
        new Audio(
            audioUrl
        );

        currentAudio.play();

        startVoiceDetection();

    };


    websocket.onclose=
    ()=>{

        console.log(
            "WebSocket Closed"
        );

    };

};


document
.getElementById(
"startBtn"
)
.onclick=
async()=>{

    conversationEnded=false;

    const speech=
    new SpeechSynthesisUtterance(
    "Hello, I am your AI event assistant. How can I help you today?"
    );

    speech.onend=
    ()=>{

        startRecording();

    };

    speechSynthesis.speak(
        speech
    );

};

</script>

</body>
</html>
