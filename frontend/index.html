<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        AI Voice Assistant
    </title>
</head>

<body>

    <h1>
        AI Voice Assistant
    </h1>

    <button id="connectBtn">
        Connect WebSocket
    </button>

    <button id="startBtn">
        Start Recording
    </button>

    <button id="stopBtn">
        Stop Recording
    </button>

    <script>

        let websocket = null;

        let mediaRecorder = null;

        let audioChunks = [];

        document
            .getElementById("connectBtn")
            .onclick = () => {

                websocket = new WebSocket(
                    "ws://localhost:8000/ws/conversation"
                );

                websocket.binaryType = "arraybuffer";

                websocket.onopen = () => {
                    console.log("WebSocket Connected");
                };

                websocket.onmessage = async (event) => {

                console.log(
                    "Received AI Audio Response"
                );

                const audioBlob = new Blob(
                    [event.data],
                    {
                        type: "audio/wav"
                    }
                );

                const audioUrl =
                    URL.createObjectURL(audioBlob);

                const audio =
                    new Audio(audioUrl);

                audio.play();
            };

                websocket.onclose = () => {
                    console.log("WebSocket Closed");
                };
            };

        document
            .getElementById("startBtn")
            .onclick = async () => {

                const stream =
                    await navigator.mediaDevices.getUserMedia(
                        {
                            audio: true
                        }
                    );

                mediaRecorder =
                    new MediaRecorder(stream);

                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {

                    audioChunks.push(event.data);
                };

                mediaRecorder.start();

                console.log("Recording Started");
            };

        document
            .getElementById("stopBtn")
            .onclick = async () => {

                mediaRecorder.stop();

                mediaRecorder.onstop = async () => {

                    const audioBlob = new Blob(
                        audioChunks,
                        {
                            type: "audio/wav"
                        }
                    );

                    console.log(
                        "Sending Audio Blob"
                    );

                    websocket.send(audioBlob);
                };

                console.log("Recording Stopped");
            };

    </script>

</body>

</html>
